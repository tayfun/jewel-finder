# Checks and deploys production (stockandlist.com) on every push to main.
# Runs the same `pnpm run deploy` as a manual deploy: web build → extension zip → Worker bundle →
# Sentry source maps (when SENTRY_AUTH_TOKEN is set) → wrangler deploy. Nothing deploys unless
# typecheck and tests pass.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required. "Edit Cloudflare Workers" template, plus R2 and the zone of the custom domain.
#   CLOUDFLARE_ACCOUNT_ID  required.
#   SENTRY_AUTH_TOKEN      optional. Uploads source maps so Sentry stack traces are readable.
#   VITE_SENTRY_DSN        optional. Lets the web app report errors.
# The Worker's own secrets (JWT_SECRET, GEMINI_API_KEY, SENTRY_DSN) stay in Cloudflare.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Not secret (same as .env.sentry.example).
          SENTRY_ORG: walknicely
          SENTRY_API_PROJECT: jewel-finder-api
          SENTRY_WEB_PROJECT: jewel-finder-web
